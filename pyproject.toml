[project]
name = "introduction-to-molecular-simulation"
version = "0.1.0"
description = "Introduction to Molecular Simulation — talk companion: what it is, why it works, and how to make one. Slides (Marp), concept notes, and hands-on examples."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuvam Banerji Seal", email = "118100973+Shuvam-Banerji-Seal@users.noreply.github.com" }]
keywords = ["molecular-simulation", "molecular-dynamics", "monte-carlo", "statistical-mechanics", "force-fields", "computational-chemistry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Education",
]
dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.6",
    "scipy>=1.10",
]

[project.optional-dependencies]
analysis = [
    "MDAnalysis>=2.0",
    "mdtraj>=1.9",
]
openmm = [
    "openmm>=8.0",
]
ase = [
    "ase>=3.22",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/Shuvam-Banerji-Seal/introduction-to-molecular-simulation"
Repository = "https://github.com/Shuvam-Banerji-Seal/introduction-to-molecular-simulation"
Issues = "https://github.com/Shuvam-Banerji-Seal/introduction-to-molecular-simulation/issues"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
